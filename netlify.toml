# Le site a déménagé sur Cloudflare Pages : l'ancienne adresse redirige vers la nouvelle,
# en gardant la page demandée (les liens existants continuent de marcher).
[build]
  publish = "site"
  command = "echo redirection"

[[redirects]]
  from = "/*"
  to = "https://tempo-2er.pages.dev/:splat"
  status = 301
  force = true
